<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100haryt | Online Shopping</title>
  <style>
    /* --- CSS RESET & VARIABLES --- */
    :root {
      --primary-color: #e63946;
      --primary-hover: #d62828;
      --secondary-color: #1d3557;
      --accent-color: #fca311;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #2b2d42;
      --text-muted: #6c757d;
      --border-color: #e9ecef;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.1);
      --radius: 12px;
      --transition: all 0.25s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 60px;
    }

    /* --- HEADER & NAVIGATION --- */
    header {
      background: var(--card-bg);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .top-bar {
      background-color: var(--secondary-color);
      color: #fff;
      font-size: 0.85rem;
      padding: 8px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .main-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 5%;
      gap: 20px;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary-color);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .logo span {
      color: var(--secondary-color);
    }

    .search-bar {
      flex: 1;
      max-width: 550px;
      position: relative;
    }

    .search-bar input {
      width: 100%;
      padding: 12px 18px;
      border-radius: 25px;
      border: 1px solid var(--border-color);
      outline: none;
      font-size: 0.95rem;
      background-color: #f1f3f5;
      transition: var(--transition);
    }

    .search-bar input:focus {
      background-color: #fff;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.15);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      position: relative;
      font-size: 1.2rem;
      color: var(--secondary-color);
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .cart-badge {
      position: absolute;
      top: -8px;
      right: -10px;
      background-color: var(--primary-color);
      color: white;
      font-size: 0.75rem;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* --- CATEGORY BAR --- */
    .categories-bar {
      display: flex;
      gap: 12px;
      padding: 12px 5%;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }

    .categories-bar::-webkit-scrollbar {
      display: none;
    }

    .category-chip {
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: var(--transition);
    }

    .category-chip.active, .category-chip:hover {
      background-color: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    /* --- HERO BANNER --- */
    .hero-container {
      margin: 20px 5%;
      background: linear-gradient(135deg, var(--secondary-color), #2a4d7c);
      color: white;
      border-radius: var(--radius);
      padding: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
    }

    .hero-content h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    .hero-content p {
      font-size: 1.1rem;
      color: #e0e6ed;
      margin-bottom: 20px;
    }

    .hero-btn {
      padding: 12px 28px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      transition: var(--transition);
    }

    .hero-btn:hover {
      background-color: var(--primary-hover);
    }

    /* --- PRODUCT GRID --- */
    .main-content {
      padding: 20px 5%;
    }

    .section-title {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: var(--secondary-color);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: var(--transition);
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .product-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background-color: var(--primary-color);
      color: white;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: bold;
    }

    .product-image {
      width: 100%;
      height: 180px;
      object-fit: contain;
      margin-bottom: 12px;
      border-radius: 8px;
    }

    .product-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.3;
      height: 2.6em;
      overflow: hidden;
    }

    .product-price {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary-color);
      margin-bottom: 12px;
    }

    .add-to-cart-btn {
      width: 100%;
      padding: 10px;
      background-color: var(--secondary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .add-to-cart-btn:hover {
      background-color: var(--primary-color);
    }

    /* --- CART DRAWER --- */
    .cart-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 200;
    }

    .cart-drawer {
      position: fixed;
      top: 0;
      right: -420px;
      width: 100%;
      max-width: 400px;
      height: 100%;
      background: var(--card-bg);
      z-index: 201;
      box-shadow: -4px 0 16px rgba(0,0,0,0.15);
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .cart-drawer.open {
      right: 0;
    }

    .cart-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-cart {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .cart-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .cart-item {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      align-items: center;
    }

    .cart-item img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      border-radius: 6px;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .cart-item-price {
      font-size: 0.9rem;
      font-color: var(--primary-color);
      font-weight: 700;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .qty-btn {
      width: 24px;
      height: 24px;
      border: 1px solid var(--border-color);
      background: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .cart-footer {
      padding: 20px;
      border-top: 1px solid var(--border-color);
      background: #fff;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .checkout-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: var(--transition);
    }

    .checkout-btn:hover {
      background-color: var(--primary-hover);
    }

    /* --- TOAST NOTIFICATION --- */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--secondary-color);
      color: white;
      padding: 12px 24px;
      border-radius: 25px;
      box-shadow: var(--shadow-md);
      transition: transform 0.3s ease;
      z-index: 300;
      font-size: 0.9rem;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* --- RESPONSIVE MEDIA QUERIES --- */
    @media (max-width: 768px) {
      .hero-container {
        flex-direction: column;
        text-align: center;
        gap: 20px;
        padding: 24px;
      }

      .main-header {
        flex-wrap: wrap;
      }

      .search-bar {
        order: 3;
        width: 100%;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div>Welcome to 100haryt Marketplace</div>
    <div>Ashgabat | Fast Delivery</div>
  </div>

  <!-- MAIN HEADER -->
  <header>
    <div class="main-header">
      <a href="#" class="logo">100<span>haryt</span></a>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search products, brands, and categories...">
      </div>
      <div class="header-actions">
        <button class="action-btn" id="cartBtn">
          🛒 <span style="display: none;">Cart</span>
          <span class="cart-badge" id="cartCount">0</span>
        </button>
      </div>
    </div>

    <!-- CATEGORIES BAR -->
    <div class="categories-bar" id="categoriesContainer">
      <button class="category-chip active" data-category="all">All Harytlar</button>
      <button class="category-chip" data-category="electronics">Electronics</button>
      <button class="category-chip" data-category="fashion">Fashion</button>
      <button class="category-chip" data-category="home">Home & Kitchen</button>
      <button class="category-chip" data-category="beauty">Beauty & Care</button>
    </div>
  </header>

  <!-- HERO SECTION -->
  <div class="hero-container">
    <div class="hero-content">
      <h1>Special Offers & Discounts</h1>
      <p>Discover high-quality electronics, home goods, and apparel delivered directly to your doorstep.</p>
      <button class="hero-btn" onclick="document.getElementById('productsSection').scrollIntoView({behavior: 'smooth'})">Shop Now</button>
    </div>
  </div>

  <!-- MAIN PRODUCT SECTION -->
  <main class="main-content" id="productsSection">
    <h2 class="section-title">Popular Products</h2>
    <div class="products-grid" id="productsGrid">
      <!-- Dynamic Products Injected via JS -->
    </div>
  </main>

  <!-- CART DRAWER -->
  <div class="cart-overlay" id="cartOverlay"></div>
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3>Your Shopping Cart</h3>
      <button class="close-cart" id="closeCart">&times;</button>
    </div>
    <div class="cart-body" id="cartItemsContainer">
      <p style="text-align: center; color: var(--text-muted); margin-top: 40px;">Your cart is empty.</p>
    </div>
    <div class="cart-footer">
      <div class="total-row">
        <span>Total Price:</span>
        <span id="cartTotalPrice">0.00 TMT</span>
      </div>
      <button class="checkout-btn" id="checkoutBtn">Proceed to Checkout</button>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div class="toast" id="toast">Item added to cart!</div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // --- PRODUCT DATA CATALOG ---
    const products = [
      {
        id: 1,
        title: "Wireless Bluetooth Headphones Pro",
        category: "electronics",
        price: 350.00,
        badge: "Sale",
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&q=80"
      },
      {
        id: 2,
        title: "Smartwatch Series 8 Waterproof",
        category: "electronics",
        price: 520.00,
        badge: "New",
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&q=80"
      },
      {
        id: 3,
        title: "Classic Minimalist Men's Watch",
        category: "fashion",
        price: 210.00,
        badge: "Popular",
        image: "https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=400&q=80"
      },
      {
        id: 4,
        title: "Automatic Drip Coffee Maker 1.5L",
        category: "home",
        price: 480.00,
        badge: "Hot",
        image: "https://images.unsplash.com/photo-1517668808822-9ebb02f2a0e6?w=400&q=80"
      },
      {
        id: 5,
        title: "Hydrating Facial Serum 50ml",
        category: "beauty",
        price: 110.00,
        badge: "Best",
        image: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=400&q=80"
      },
      {
  id: 6,
  title: "Ergonomic Office Chair with Lumbar Support",
  category: "home",
  price: 890.00,
  badge: "Sale",
  image: "https://images.unsplash.com/photo-1598300042247-d088f8ab3a91?w=400&q=80"
},
      {
        id: 7,
        title: "Unisex Cotton Casual Hoodie",
        category: "fashion",
        price: 180.00,
        badge: "New",
        image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=400&q=80"
      },
      {
        id: 8,
        title: "Portable Mini Bluetooth Speaker",
        category: "electronics",
        price: 140.00,
        badge: "Popular",
        image: "https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=400&q=80"
      }
    ];

    // --- STATE MANAGEMENT ---
    let cart = [];
    let selectedCategory = "all";
    let searchQuery = "";

    // --- DOM ELEMENTS ---
    const productsGrid = document.getElementById("productsGrid");
    const categoriesContainer = document.getElementById("categoriesContainer");
    const searchInput = document.getElementById("searchInput");
    const cartBtn = document.getElementById("cartBtn");
    const closeCart = document.getElementById("closeCart");
    const cartDrawer = document.getElementById("cartDrawer");
    const cartOverlay = document.getElementById("cartOverlay");
    const cartItemsContainer = document.getElementById("cartItemsContainer");
    const cartTotalPrice = document.getElementById("cartTotalPrice");
    const cartCount = document.getElementById("cartCount");
    const toast = document.getElementById("toast");
    const checkoutBtn = document.getElementById("checkoutBtn");

    // --- RENDER PRODUCTS ---
    function renderProducts() {
      const filtered = products.filter(product => {
        const matchesCategory = selectedCategory === "all" || product.category === selectedCategory;
        const matchesSearch = product.title.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        productsGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No products found.</p>`;
        return;
      }

      productsGrid.innerHTML = filtered.map(product => `
  <div class="product-card">
    <span class="product-badge">${product.badge}</span>
    <img 
      src="${product.image}" 
      alt="${product.title}" 
      class="product-image"
      onerror="this.src='https://via.placeholder.com/200?text=No+Image'"
    >
    <div>
      <h3 class="product-title">${product.title}</h3>
      <div class="product-price">${product.price.toFixed(2)} TMT</div>
    </div>
    <button class="add-to-cart-btn" onclick="addToCart(${product.id})">Add to Cart</button>
  </div>
`).join('');
    }

    // --- CART ACTIONS ---
    function addToCart(productId) {
      const existingItem = cart.find(item => item.id === productId);
      if (existingItem) {
        existingItem.quantity += 1;
      } else {
        const product = products.find(p => p.id === productId);
        cart.push({ ...product, quantity: 1 });
      }
      updateCartUI();
      showToast("Product added to cart!");
    }

    function updateQuantity(productId, delta) {
      const item = cart.find(item => item.id === productId);
      if (!item) return;

      item.quantity += delta;
      if (item.quantity <= 0) {
        cart = cart.filter(p => p.id !== productId);
      }
      updateCartUI();
    }

    function updateCartUI() {
      // Update badge
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      cartCount.textContent = totalItems;

      // Update cart drawer items
      if (cart.length === 0) {
        cartItemsContainer.innerHTML = `<p style="text-align: center; color: var(--text-muted); margin-top: 40px;">Your cart is empty.</p>`;
      } else {
        cartItemsContainer.innerHTML = cart.map(item => `
          <div class="cart-item">
            <img src="${item.image}" alt="${item.title}">
            <div class="cart-item-info">
              <div class="cart-item-title">${item.title}</div>
              <div class="cart-item-price">${(item.price * item.quantity).toFixed(2)} TMT</div>
              <div class="quantity-controls">
                <button class="qty-btn" onclick="updateQuantity(${item.id}, -1)">-</button>
                <span>${item.quantity}</span>
                <button class="qty-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
              </div>
            </div>
          </div>
        `).join('');
      }

      // Update total price
      const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      cartTotalPrice.textContent = `${total.toFixed(2)} TMT`;
    }

    // --- TOAST NOTIFICATION ---
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }

    // --- EVENT LISTENERS ---
    categoriesContainer.addEventListener("click", (e) => {
      if (e.target.classList.contains("category-chip")) {
        document.querySelectorAll(".category-chip").forEach(chip => chip.classList.remove("active"));
        e.target.classList.add("active");
        selectedCategory = e.target.dataset.category;
        renderProducts();
      }
    });

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderProducts();
    });

    // Cart Toggle Logic
    const toggleCart = (open) => {
      if (open) {
        cartDrawer.classList.add("open");
        cartOverlay.style.display = "block";
      } else {
        cartDrawer.classList.remove("open");
        cartOverlay.style.display = "none";
      }
    };

    cartBtn.addEventListener("click", () => toggleCart(true));
    closeCart.addEventListener("click", () => toggleCart(false));
    cartOverlay.addEventListener("click", () => toggleCart(false));

    checkoutBtn.addEventListener("click", () => {
      if (cart.length === 0) {
        alert("Your cart is empty.");
        return;
      }
      alert("Order placed successfully! Thank you for shopping with 100haryt.");
      cart = [];
      updateCartUI();
      toggleCart(false);
    });

    // --- INITIAL RENDER ---
    renderProducts();
  </script>
</body>
</html>
